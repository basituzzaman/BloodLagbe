spring.application.name=BloodLagbe

# MySQL configuration (data persists between restarts)
spring.datasource.url=jdbc:mysql://localhost:3306/bloodlagbe?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT configuration
bloodlagbe.jwt.secret=change-this-secret-in-production-please
bloodlagbe.jwt.expiration-ms=86400000

# CORS
bloodlagbe.cors.allowed-origins=http://localhost:5173

server.port=8080
